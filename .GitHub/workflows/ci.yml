name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (prefer lockfile)
        run: |
          npm ci || npm install

      - name: Run typecheck & lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Run tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Upload coverage (if exists)
        if: success() && startsWith(matrix.node-version, '20')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
